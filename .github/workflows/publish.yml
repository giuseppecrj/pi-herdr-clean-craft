name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/npm-bootstrap/package.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: pi-herdr-clean-craft-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.detect.outputs.decision }}
      name: ${{ steps.detect.outputs.name }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - name: Detect release candidate
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release/detect.mjs

  release:
    name: Publish, tag, and create GitHub release
    needs: detect
    if: >-
      needs.detect.outputs.decision == 'candidate'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26.12.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Confirm release candidate
        env:
          CANDIDATE_NAME: ${{ needs.detect.outputs.name }}
          CANDIDATE_VERSION: ${{ needs.detect.outputs.version }}
          CANDIDATE_TAG: ${{ needs.detect.outputs.tag }}
          CANDIDATE_SHA: ${{ needs.detect.outputs.sha }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: node scripts/release/guard.mjs
      - name: Check npm registry
        id: registry
        env:
          PACKAGE_NAME: ${{ needs.detect.outputs.name }}
          VERSION: ${{ needs.detect.outputs.version }}
          REGISTRY_URL: https://registry.npmjs.org/
        run: node scripts/release/registry.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: npm run format:check
      - name: Run lint
        run: npm run lint
      - name: Provision Pi 1.1.0
        run: |
          archive="$RUNNER_TEMP/pi-linux-x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --max-time 300 --max-filesize 67108864 --output "$archive" \
            https://github.com/earendil-works/pi/releases/download/v1.1.0/pi-linux-x64.tar.gz
          echo "3faa94666cd3849d37af320ff749407d0271b07a9b94f420c87e30866e10e289  $archive" \
            | sha256sum --check --strict -
          dir="$(mktemp -d "$RUNNER_TEMP/pi.XXXXXX")"
          tar -xzf "$archive" -C "$dir" --no-same-owner
          echo "5d527eae57d99f80f9397a84d0228528a92b3595b2c5f3d969e45b02ea72a6bc  $dir/pi/pi" \
            | sha256sum --check --strict -
          echo "CLEAN_CRAFT_PI_BIN=$dir/pi/pi" >> "$GITHUB_ENV"
      - name: Run checks
        run: npm run check
      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Publish, tag, and create GitHub release
        env:
          PACKAGE_NAME: ${{ needs.detect.outputs.name }}
          VERSION: ${{ needs.detect.outputs.version }}
          TAG: ${{ needs.detect.outputs.tag }}
          REGISTRY_STATE: ${{ steps.registry.outputs.registry }}
          BOOTSTRAP_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/release.mjs

  bootstrap:
    name: Publish metadata-only bootstrap
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'giuseppecrj/pi-herdr-clean-craft'
      && github.event.repository.private == false
      && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26.12.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Stage and publish bootstrap metadata
        env:
          NODE_AUTH_TOKEN: ''
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git cat-file -e "$BEFORE_SHA^{commit}"
          previous="$(git ls-tree --name-only "$BEFORE_SHA" -- \
            .github/npm-bootstrap/package.json)"
          if [ -n "$previous" ]; then
            echo 'Bootstrap manifest already existed; no publication.'
            exit 0
          fi
          stage="$(mktemp -d "$RUNNER_TEMP/bootstrap.XXXXXX")"
          node --input-type=module - "$stage" <<'NODE'
          import fs from 'node:fs';
          const [stage] = process.argv.slice(2);
          const src = '.github/npm-bootstrap';
          const names = ['LICENSE', 'README.md', 'package.json'];
          const fail = (m) => {
            console.error(`bootstrap: ${m}`); process.exit(1);
          };
          if (fs.readdirSync(src).sort().join() !== names.join()) {
            fail('expected exactly three files');
          }
          for (const n of names) {
            const st = fs.lstatSync(`${src}/${n}`);
            if (!st.isFile() || (st.mode & 0o111)) {
              fail(`${n} must be a regular non-executable file`);
            }
          }
          const m = JSON.parse(fs.readFileSync(`${src}/package.json`, 'utf8'));
          const keys = ['bugs', 'description', 'files', 'homepage', 'license',
            'name', 'publishConfig', 'repository', 'version'];
          if (Object.keys(m).sort().join() !== keys.join()) {
            fail('unexpected manifest keys');
          }
          if (m.name !== 'pi-herdr-clean-craft' ||
              m.version !== '0.0.0-bootstrap.1') fail('unexpected identity');
          const repo = 'git+https://github.com/' +
            'giuseppecrj/pi-herdr-clean-craft.git';
          if (m.repository?.url !== repo) fail('unexpected repository');
          if (m.publishConfig?.access !== 'public' ||
              m.publishConfig?.tag !== 'bootstrap') fail('publishConfig');
          if (m.files?.join() !== 'README.md,LICENSE') fail('files list');
          for (const n of ['LICENSE', 'README.md']) {
            fs.copyFileSync(`${src}/${n}`, `${stage}/${n}`);
          }
          m.gitHead = process.env.GITHUB_SHA;
          fs.writeFileSync(`${stage}/package.json`,
            `${JSON.stringify(m, null, 2)}\n`);
          NODE
          cd "$stage"
          npm publish --ignore-scripts --access public --tag bootstrap \
            --provenance --fetch-retries=0 \
            --registry https://registry.npmjs.org/
